<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<title>Υπερκύβος 4D — React</title>
<style>

@media (prefers-color-scheme:dark) { :root { --background:#121720; --foreground:#ebeff8; --muted-foreground:#acb8cb; --viz-series-1:#7caaff; --viz-series-2:#fa8db7; } }

</style></head><body>
<div id="hypercube-react-root"></div>
<style>

  #hypercube-react-root .hc-view-label strong { color:var(--foreground); font-weight:500; }

  #hypercube-react-root .hc-palette-group { display:grid; gap:7px; min-width:0; }
  #hypercube-react-root .hc-palette-group strong { font-weight:500; }
  #hypercube-react-root .hc-palette-group label { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  #hypercube-react-root .hc-palette-group select { max-width:170px; }
  #hypercube-react-root .hc-controls { display:grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap:24px; row-gap:12px; margin-top:12px; }
  #hypercube-react-root .hc-control-head { margin-bottom:3px; }
  #hypercube-react-root .hc-control-head output { font-variant-numeric:tabular-nums; color:var(--muted-foreground); }

  @media (max-width: 620px) { #hypercube-react-root .hc-stage, #hypercube-react-root .hc-controls, #hypercube-react-root .hc-palette { grid-template-columns:1fr; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script>
(() => {
  const root = document.getElementById('hypercube-react-root');
  if (!root || !window.React || !window.ReactDOM) return;
  const h = React.createElement;
  const vertices = Array.from({ length: 16 }, (_, i) =>
    [0, 1, 2, 3].map(bit => (i & (1 << bit)) ? 1 : -1));
  const edges = [];
  for (let i = 0; i < 16; i++) {
    for (let axis = 0; axis < 4; axis++) {
      const j = i ^ (1 << axis);
      if (i < j) edges.push({ a: i, b: j, axis });
    }
  }
  const initial = { xw: 38, yw: 22, zw: 12, depth: 3.8, yaw: 0.55, pitch: 0.32,
    zoom: 1, slice: 0, show3D: true, mode: 'projection',
    paletteOpen: false, color4: null, color3: null, map4: 'mono', map3: 'mono',
    playing: !window.matchMedia('(prefers-reduced-motion: reduce)').matches };
  const colorMaps = {
    viridis: ['#440154','#3b528b','#21918c','#5ec962','#fde725'],
    plasma: ['#0d0887','#7e03a8','#cc4778','#f89540','#f0f921'],
    coolwarm: ['#3b4cc0','#8db0fe','#dddcdc','#f49a7b','#b40426']
  };
  function colorAt(map, t, fallback) {
    if (map === 'mono') return fallback;
    const stops = colorMaps[map], v = Math.max(0, Math.min(1, t)) * (stops.length - 1);
    const index = Math.min(stops.length - 2, Math.floor(v)), alpha = v - index;
    const channel = (hex, n) => parseInt(hex.slice(1 + 2*n, 3 + 2*n), 16);
    const rgb = [0,1,2].map(n => Math.round(channel(stops[index],n) * (1-alpha) +
      channel(stops[index+1],n) * alpha));
    return 'rgb(' + rgb.join(',') + ')';
  }
  const unit = (value, min, max) => (value - min) / Math.max(1e-9, max - min);
  const degrees = Math.PI / 180;
  function rotate(v, a, b, angle) {
    const c = Math.cos(angle), s = Math.sin(angle), out = v.slice();
    out[a] = c * v[a] - s * v[b];
    out[b] = s * v[a] + c * v[b];
    return out;
  }
  function rotate4(v, state, phase) {
    let p = rotate(v, 0, 3, (state.xw + phase * 27) * degrees);
    p = rotate(p, 1, 3, (state.yw + phase * 17) * degrees);
    p = rotate(p, 2, 3, state.zw * degrees);
    return rotate(p, 0, 1, phase * 0.12);
  }
  function camera(q, state) {
    const cy = Math.cos(state.yaw), sy = Math.sin(state.yaw);
    const cp = Math.cos(state.pitch), sp = Math.sin(state.pitch);
    const x = cy * q[0] + sy * q[2];
    const z = -sy * q[0] + cy * q[2];
    return [x, cp * q[1] - sp * z, sp * q[1] + cp * z];
  }
  function perspective(q, state) {
    const [x, y, depth] = camera(q, state);
    const k3 = 5 / (5 - depth);
    return { x: 250 + x * 69 * k3 * state.zoom,
      y: 220 - y * 69 * k3 * state.zoom, depth };
  }
  function fitPoints(raw, reference = raw) {
    if (!raw.length || !reference.length) return [];
    const xs = reference.map(p => p.x), ys = reference.map(p => p.y);
    const left = Math.min(...xs), right = Math.max(...xs);
    const top = Math.min(...ys), bottom = Math.max(...ys);
    const fit = Math.min(1, 440 / Math.max(1, right - left), 365 / Math.max(1, bottom - top));
    return raw.map(p => ({ ...p,
      x: 250 + (p.x - (left + right) / 2) * fit,
      y: 220 + (p.y - (top + bottom) / 2) * fit }));
  }
  function project4coords(p, state) {
    const k4 = state.depth / (state.depth - p[3]);
    return [p[0] * k4, p[1] * k4, p[2] * k4];
  }
  function project4(p, state) {
    return perspective(project4coords(p, state), state);
  }
  function hull3D(rotated, state) {
    const points3 = rotated.map(p => project4coords(p, state));
    const faces = [], known = new Set(), eps = 1e-7;
    const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
    const sub = (a, b) => a.map((x, i) => x - b[i]);
    const cross = (a, b) => [a[1] * b[2] - a[2] * b[1],
      a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
    for (let i = 0; i < 16; i++) for (let j = i + 1; j < 16; j++)
      for (let k = j + 1; k < 16; k++) {
        let normal = cross(sub(points3[j], points3[i]), sub(points3[k], points3[i]));
        const size = Math.hypot(...normal);
        if (size < eps) continue;
        normal = normal.map(x => x / size);
        const distances = points3.map(p => dot(normal, sub(p, points3[i])));
        const lo = Math.min(...distances), hi = Math.max(...distances);
        if (lo < -eps && hi > eps) continue;
        if (lo >= -eps) normal = normal.map(x => -x);
        const plane = dot(normal, points3[i]);
        const ids = points3.map((p, index) => ({ p, index }))
          .filter(({ p }) => Math.abs(dot(normal, p) - plane) < eps)
          .map(({ index }) => index);
        if (ids.length < 3) continue;
        const key = ids.join('-');
        if (known.has(key)) continue;
        known.add(key);
        const center = [0, 1, 2].map(axis =>
          ids.reduce((sum, id) => sum + points3[id][axis], 0) / ids.length);
        const ref = Math.abs(normal[2]) < .9 ? [0, 0, 1] : [0, 1, 0];
        const u = cross(ref, normal), v = cross(normal, u);
        const angle = id => {
          const delta = sub(points3[id], center);
          return Math.atan2(dot(delta, v), dot(delta, u));
        };
        ids.sort((a, b) => angle(a) - angle(b));
        const [nx, ny, nz] = camera(normal, state);
        const [cx, cy, cz] = camera(center, state);
        const view = [-cx, -cy, 5 - cz];
        const front = (nx*view[0] + ny*view[1] + nz*view[2]) /
          Math.max(1e-9, Math.hypot(...view));
        const light = Math.max(0, nx * .3 + ny * .6 + nz * .7);
        const z = ids.reduce((sum, id) => sum + camera(points3[id], state)[2], 0) / ids.length;
        faces.push({ ids, front, light, z, key });
      }
    const screen = fitPoints(points3.map(q => perspective(q, state)));
    const perimeter = new Map();
    faces.forEach(face => face.ids.forEach((a, i) => {
      const b = face.ids[(i + 1) % face.ids.length];
      const key = Math.min(a, b) + '-' + Math.max(a, b);
      const edge = perimeter.get(key) || { a, b, front: -1 };
      edge.front = Math.max(edge.front, face.front);
      perimeter.set(key, edge);
    }));
    return { screen,
      vertices: [...new Set(faces.flatMap(face => face.ids))],
      visibleVertices: [...new Set(faces.filter(face => face.front > 1e-6).flatMap(face => face.ids))],
      faces: faces.sort((a, b) => a.z - b.z),
      edges: [...perimeter.values()].sort((a, b) =>
        (screen[a.a].depth + screen[a.b].depth) - (screen[b.a].depth + screen[b.b].depth)) };
  }
  function crossSection(rotated, state, phase) {
    const points3 = [];
    const edgeToPoints = new Map();
    const eps = 1e-8;
    function insert(q) {
      let index = points3.findIndex(p => p.reduce((sum, x, axis) =>
        sum + (x - q[axis]) ** 2, 0) < 1e-12);
      if (index < 0) { index = points3.length; points3.push(q); }
      return index;
    }
    for (const edge of edges) {
      const a = rotated[edge.a], b = rotated[edge.b];
      const da = a[3] - state.slice, db = b[3] - state.slice;
      const ids = [];
      if (Math.abs(da) < eps) ids.push(insert(a.slice(0, 3)));
      if (Math.abs(db) < eps) ids.push(insert(b.slice(0, 3)));
      if (da * db < -eps * eps) {
        const t = da / (da - db);
        ids.push(insert([0, 1, 2].map(axis => a[axis] + t * (b[axis] - a[axis]))));
      }
      if (ids.length) edgeToPoints.set(edge, [...new Set(ids)]);
    }
    // On W = constant, the 4D perspective is a uniform scale of the section.
    const k4 = state.depth / (state.depth - state.slice);
    const section3 = points3.map(q => q.map(value => value * k4));
    const screen = fitPoints(section3.map(q => perspective(q, state)));
    const sectionFaces = [];
    const sectionEdges = new Map();
    const seenFaces = new Set();
    for (let fixed = 0; fixed < 4; fixed++) for (let side = 0; side < 2; side++) {
      const ids = [...new Set(edges.filter(edge => edgeToPoints.has(edge) &&
        ((edge.a >> fixed) & 1) === side && ((edge.b >> fixed) & 1) === side)
        .flatMap(edge => edgeToPoints.get(edge)))];
      if (ids.length < 3) continue;
      const signature = [...ids].sort((a,b) => a-b).join('-');
      if (seenFaces.has(signature)) continue;
      seenFaces.add(signature);
      const axis4 = [0, 0, 0, 0]; axis4[fixed] = side ? 1 : -1;
      const normal = rotate4(axis4, state, phase);
      const length = Math.hypot(normal[0], normal[1], normal[2]);
      if (length < 1e-9) continue;
      const n = [normal[0] / length, normal[1] / length, normal[2] / length];
      const ref = Math.abs(n[2]) < .9 ? [0, 0, 1] : [0, 1, 0];
      const cross = (a, b) => [a[1] * b[2] - a[2] * b[1],
        a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
      const u = cross(ref, n), v = cross(n, u);
      const center = [0, 1, 2].map(axis =>
        ids.reduce((sum, i) => sum + points3[i][axis], 0) / ids.length);
      const angle = i => {
        const delta = points3[i].map((x, axis) => x - center[axis]);
        const dot = vector => delta.reduce((sum, x, axis) => sum + x * vector[axis], 0);
        return Math.atan2(dot(v), dot(u));
      };
      ids.sort((a, b) => angle(a) - angle(b));
      const [nx, ny, nz] = camera(n, state);
      const [cx, cy, cz] = camera(center.map(value => value * k4), state);
      const view = [-cx, -cy, 5 - cz];
      const front = (nx*view[0] + ny*view[1] + nz*view[2]) /
        Math.max(1e-9, Math.hypot(...view));
      const light = Math.max(0, nx * .3 + ny * .6 + nz * .7);
      const z = ids.reduce((sum, i) => sum + camera(section3[i], state)[2], 0) / ids.length;
      sectionFaces.push({ ids, front, light, z, key: fixed + '-' + side });
      ids.forEach((a, i) => {
        const b = ids[(i + 1) % ids.length];
        const key = Math.min(a, b) + '-' + Math.max(a, b);
        const item = sectionEdges.get(key) || { a, b, front: -1 };
        item.front = Math.max(item.front, front);
        sectionEdges.set(key, item);
      });
    }
    return { screen, section3, vertices: screen.map((_, i) => i),
      visibleVertices: [...new Set(sectionFaces.filter(face => face.front > 1e-6).flatMap(face => face.ids))],
      faces: sectionFaces.sort((a, b) => a.z - b.z),
      edges: [...sectionEdges.values()].sort((a, b) =>
        (screen[a.a].depth + screen[a.b].depth) - (screen[b.a].depth + screen[b.b].depth)) };
  }
  function App() {
    const [s, setS] = React.useState(initial);
    const [phase, setPhase] = React.useState(0);
    const dragging = React.useRef(null);
    React.useEffect(() => {
      if (!s.playing) return;
      let frame, previous;
      function tick(now) {
        if (previous !== undefined) setPhase(v => v + Math.min(now - previous, 50) / 1000);
        previous = now;
        frame = requestAnimationFrame(tick);
      }
      frame = requestAnimationFrame(tick);
      return () => cancelAnimationFrame(frame);
    }, [s.playing]);
    const rotated = vertices.map(v => rotate4(v, s, phase));
    const rawPoints = rotated.map(v => project4(v, s));
    const points = fitPoints(rawPoints);
    const solid = s.show3D ? (s.mode === 'projection' ? hull3D(rotated, s) :
      crossSection(rotated, s, phase)) : { screen: [], vertices: [], visibleVertices: [], faces: [], edges: [] };
    const cutPoints = s.mode === 'slice' && s.show3D ?
      fitPoints(solid.section3.map(q => perspective(q, s)), rawPoints) : [];
    const z4 = points.map(p => p.depth), z3 = solid.screen.map(p => p.depth);
    const leftColor = value => colorAt(s.map4, unit(value, Math.min(...z4), Math.max(...z4)),
      s.color4 || 'var(--viz-series-1)');
    const rightColor = value => colorAt(s.map3,
      unit(value, Math.min(...z3), Math.max(...z3)),
      s.color3 || 'var(--viz-series-2)');
    function footprint(w) {
      const group = points.slice(w * 8, w * 8 + 8);
      return (Math.max(...group.map(p => p.x)) - Math.min(...group.map(p => p.x))) *
        (Math.max(...group.map(p => p.y)) - Math.min(...group.map(p => p.y)));
    }
    const innerW = footprint(0) <= footprint(1) ? 0 : 1;
    const orderedEdges = edges.map((edge, i) => ({
      ...edge, i, z: (points[edge.a].depth + points[edge.b].depth) / 2,
      group: edge.axis === 3 ? -1 : (edge.a >> 3)
    })).sort((a, b) => a.z - b.z);
    const exactCube = !s.playing && phase === 0 && s.xw === 0 && s.yw === 0 &&
      s.zw === 0 && s.show3D && (s.mode === 'projection' || s.slice === 0);
    const set = (key, value) => setS(old => ({ ...old, [key]: value }));
    function start(e) { dragging.current = { x: e.clientX, y: e.clientY, yaw: s.yaw, pitch: s.pitch }; e.currentTarget.setPointerCapture(e.pointerId); }
    function move(e) {
      if (!dragging.current) return;
      const d = dragging.current;
      setS(old => ({ ...old,
        yaw: d.yaw + (e.clientX - d.x) * 0.009,
        pitch: Math.max(-1.45, Math.min(1.45, d.pitch + (e.clientY - d.y) * 0.009))
      }));
    }
    function slider(key, label, min, max, step, suffix) {
      return h('label', { key, className: 'hc-slider' },
        h('span', { className: 'hc-control-head' }, h('span', null, label), h('output', null, s[key] + suffix)),
        h('input', { className: 'form-range', type: 'range', min, max, step, value: s[key],
          onChange: e => set(key, Number(e.target.value)), 'aria-label': label }));
    }
    function switchControl(key, label) {
      return h('label', { className: 'form-check form-switch', key },
        h('input', { className: 'form-check-input', type: 'checkbox', checked: s[key],
          onChange: e => set(key, e.target.checked) }),
        h('span', { className: 'form-check-label' }, label));
    }
    function modeControl() {
      return h('label', { className: 'hc-mode' }, '3D απεικόνιση ',
        h('select', { className: 'form-select', value: s.mode,
          onChange: e => set('mode', e.target.value) },
          h('option', { value: 'projection' }, 'Προβολή · περίβλημα'),
          h('option', { value: 'slice' }, 'Τομή · επίπεδο W')));
    }
    function paletteGroup(key, label, chosen, map) {
      return h('div', { className: 'hc-palette-group', key },
        h('strong', null, label),
        h('label', null, 'Χρώμα',
          h('input', { className:'form-control form-control-color', type:'color',
            value: chosen || (key === '4' ? '#3164bf' : '#c75483'),
            onChange: e => setS(old => ({ ...old,
              ['color'+key]: e.target.value, ['map'+key]: 'mono' })),
            'aria-label': 'Χρώμα για ' + label })),
        h('label', null, 'Colormap',
          h('select', { className:'form-select', value:map,
            onChange:e => set('map'+key, e.target.value),
            'aria-label':'Colormap για ' + label },
            h('option', { value:'mono' }, 'Ενιαίο χρώμα'),
            h('option', { value:'viridis' }, 'Viridis · βάθος'),
            h('option', { value:'plasma' }, 'Plasma · βάθος'),
            h('option', { value:'coolwarm' }, 'Coolwarm · βάθος'))));
    }
    function scene(shaded) {
      const prefix = shaded ? 'hc-section' : 'hc-wire';
      return h('svg', { viewBox: '0 0 500 440', role: 'img',
        'aria-label': shaded ? (s.mode === 'projection' ? 'Το κυρτό εξωτερικό περίβλημα της 3D προβολής.' :
          'Η τρισδιάστατη τομή του περιστρεφόμενου υπερκύβου.') :
          'Ο σκελετός του υπερκύβου με 16 κορυφές και 32 ακμές.',
        onPointerDown: start, onPointerMove: move,
        onPointerUp: () => { dragging.current = null; },
        onPointerCancel: () => { dragging.current = null; },
        style: { cursor: dragging.current ? 'grabbing' : 'grab' } },
        h('defs', null,
          h('radialGradient', { id: prefix + '-glow' },
            h('stop', { offset: '0%', stopColor: shaded ? 'var(--viz-series-2)' : 'var(--viz-series-1)', stopOpacity: shaded ? '.12' : '.1' }),
            h('stop', { offset: '100%', stopColor: shaded ? 'var(--viz-series-2)' : 'var(--viz-series-1)', stopOpacity: '0' })),
          h('radialGradient', { id: prefix + '-shadow' },
            h('stop', { offset: '0%', stopColor: 'var(--viz-series-2)', stopOpacity: '.25' }),
            h('stop', { offset: '100%', stopColor: 'var(--viz-series-2)', stopOpacity: '0' }))),
        h('ellipse', { cx: 250, cy: 220, rx: 245, ry: 208, fill: 'url(#' + prefix + '-glow)' }),
        shaded && s.show3D && h('ellipse', { cx: 255, cy: 390, rx: 155, ry: 29, fill: 'url(#' + prefix + '-shadow)' }),
        shaded && !s.show3D && h('text', { x: 250, y: 220, textAnchor: 'middle', fill: 'var(--muted-foreground)' },
          'Ενεργοποίησε το 3D σχήμα'),
        shaded && solid.faces.filter(face => face.front > 1e-6).map(face =>
          h('polygon', { key: face.key,
            points: face.ids.map(index => solid.screen[index].x + ',' + solid.screen[index].y).join(' '),
            fill: rightColor(face.z),
            fillOpacity: Math.min(.94, .66 + face.light * .22 + face.front * .08),
            stroke: rightColor(face.z), strokeOpacity: .5,
            strokeWidth: 1,
            style: { filter: 'drop-shadow(0px 5px 7px ' + rightColor(face.z) + ')' } })),
        shaded && solid.edges.filter(edge => edge.front > 1e-6).map((edge, i) => {
          const a = solid.screen[edge.a], b = solid.screen[edge.b];
          return h('line', { key: i, x1: a.x, y1: a.y, x2: b.x, y2: b.y,
            stroke: rightColor((a.depth+b.depth)/2), strokeOpacity: .95,
            strokeWidth: 2.3, strokeLinecap: 'round' });
        }),
        shaded && solid.visibleVertices.map(i => h('circle', { key: i, cx: solid.screen[i].x, cy: solid.screen[i].y,
          r: 3.2, fill: rightColor(solid.screen[i].depth), stroke: 'var(--background)', strokeWidth: 1.2 })),
        !shaded && orderedEdges.map(edge => {
          const a = points[edge.a], b = points[edge.b];
          const inner = edge.group === innerW;
          const color = s.map4 === 'mono' && !s.color4 && inner ?
            'var(--viz-series-2)' : leftColor(edge.z);
          const opacity = Math.min(.98, Math.max(.34, .65 + edge.z * .11));
          return h('line', { key: edge.i, x1: a.x, y1: a.y, x2: b.x, y2: b.y,
            stroke: color, strokeOpacity: edge.group === -1 ? opacity * .66 : opacity,
            strokeWidth: inner ? 2.4 : 1.8, strokeLinecap: 'round' });
        }),
        !shaded && cutPoints.length > 0 && solid.edges.map((edge, i) => {
          const a=cutPoints[edge.a], b=cutPoints[edge.b];
          return h('line', { key:'cut-'+i, x1:a.x, y1:a.y, x2:b.x, y2:b.y,
            stroke:rightColor((solid.screen[edge.a].depth+solid.screen[edge.b].depth)/2),
            strokeOpacity:.92, strokeWidth:3.5, strokeLinecap:'round' });
        }),
        !shaded && points.map((p, i) => h('circle', { key: i, cx: p.x, cy: p.y,
          r: Math.max(3, 3.8 + p.depth * .38),
          fill: s.map4 === 'mono' && !s.color4 && (i >> 3) === innerW ?
            'var(--viz-series-2)' : leftColor(p.depth),
          stroke: 'var(--background)', strokeWidth: 1.35 }))); 
    }
    return h(React.Fragment, null,
      h('div', { className: 'hc-top' },
        h('h2', null, 'Υπερκύβος 4D'),
        h('div', { className: 'hc-actions' },
          switchControl('playing', 'Αυτόματη περιστροφή'),
          switchControl('show3D', '3D σχήμα'),
          h('button', { type: 'button', className: 'btn btn-primary',
            onClick: () => {
              setS(old => ({ ...old, playing: false, show3D: true, mode: 'projection',
                xw: 0, yw: 0, zw: 0, slice: 0, zoom: 1 }));
              setPhase(0);
            } }, 'Δείξε 3D κύβο'),
          h('button', { type: 'button', className: 'btn',
            onClick: () => { setS(initial); setPhase(0); } }, 'Επαναφορά'),
          h('button', { type:'button', className:'btn', 'aria-expanded':s.paletteOpen,
            onClick:()=>set('paletteOpen',!s.paletteOpen) }, 'Χρώματα / colormaps'),
          h('a', { className:'btn', href:'hypercube-math.pdf', download:'hypercube-math.pdf' },
            'Μαθηματική τεκμηρίωση (PDF)'))),
      h('div', { className: 'hc-stage' },
        h('div', { className: 'hc-view' },
          h('div', { className: 'hc-view-label' }, h('strong', null, 'Υπερκύβος 4D'), h('span', null, '16 κορυφές · 32 ακμές')),
          scene(false)),
        h('div', { className: 'hc-view' },
          h('div', { className: 'hc-view-label' }, h('strong', null, s.mode === 'projection' ? 'Προβολή στον 3D χώρο' : 'Τομή στον 3D χώρο'),
            h('span', null, s.show3D ? solid.vertices.length + ' κορυφές · ' + solid.faces.length + ' έδρες' : 'ανενεργή')),
          scene(true))),
      h('div', { className: 'hc-options' }, modeControl()),
      s.paletteOpen && h('div', { className:'hc-palette' },
        paletteGroup('4','Υπερκύβος 4D',s.color4,s.map4),
        paletteGroup('3','3D προβολή / τομή',s.color3,s.map3)),
      h('div', { className: 'hc-controls' },
        slider('xw', 'Περιστροφή X–W', -180, 180, 1, '°'),
        slider('yw', 'Περιστροφή Y–W', -180, 180, 1, '°'),
        slider('zw', 'Περιστροφή Z–W', -180, 180, 1, '°'),
        s.mode === 'slice' && slider('slice', 'Επίπεδο τομής W', -.85, .85, .01, ''),
        slider('depth', '4D προοπτική', 2.6, 8, .1, ''),
        slider('zoom', 'Μεγέθυνση', .5, 1.35, .01, '×')),
      h('p', { className: 'hc-hint', 'aria-live': 'polite' },
        exactCube ? (s.mode === 'projection' ? 'Κυβική 3D προβολή' : 'Κυβική 3D τομή') +
          ': X–W = 0°, Y–W = 0°, Z–W = 0°' + (s.mode === 'slice' ? ', W = 0' : '') +
          '. Η αυτόματη περιστροφή σταμάτησε.' :
          s.mode === 'projection' ? 'Δεξιά: το κυρτό εξωτερικό περίβλημα των 16 κορυφών αφού προβληθούν από 4D σε 3D.' :
            'Δεξιά: πραγματική τομή του 4D υπερκύβου στο W = ' + s.slice +
            ', προβαλλόμενη με την ίδια 4D προοπτική. Αριστερά τονίζονται οι ακμές της τομής.'));
  }
  ReactDOM.createRoot(root).render(h(App));
})();
</script>
