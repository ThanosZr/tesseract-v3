<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script>
(() => {
  const root = document.getElementById('hypercube-react-root');
  if (!root || !window.React || !window.ReactDOM) return;
  const h = React.createElement;
  const vertices = Array.from({ length: 16 }, (_, i) =>
    [0, 1, 2, 3].map(bit => (i & (1 << bit)) ? 1 : -1));
  const edges = [];
  for (let i = 0; i < 16; i++) {
    for (let axis = 0; axis < 4; axis++) {
      const j = i ^ (1 << axis);
      if (i < j) edges.push({ a: i, b: j, axis });
    }
  }
  const initial = { xw: 38, yw: 22, zw: 12, depth: 3.8, yaw: 0.55, pitch: 0.32,
    zoom: 1, slice: 0, show3D: true, mode: 'projection',
    playing: !window.matchMedia('(prefers-reduced-motion: reduce)').matches };
  const degrees = Math.PI / 180;
  const EYE = 5; // απόσταση 3D κάμερας από την αρχή των αξόνων

  // ---------- Χρώματα ----------
  // Δείγματα 11 σημείων από τα colormaps του matplotlib (inferno/magma στο [0.08, 0.96]).
  const CMAPS = {
    viridis: { name: 'Viridis', stops: ['#440154','#482475','#414487','#355f8d','#2a788e','#21918c','#22a884','#44bf70','#7ad151','#bddf26','#fde725'] },
    plasma: { name: 'Plasma', stops: ['#0d0887','#41049d','#6a00a8','#8f0da4','#b12a90','#cc4778','#e16462','#f2844b','#fca636','#fcce25','#f0f921'] },
    inferno: { name: 'Inferno', stops: ['#10092d','#340a5f','#59106e','#7d1e6d','#a02a63','#c33b4f','#df5337','#f3761b','#fb9d07','#f9c932','#f2f27d'] },
    magma: { name: 'Magma', stops: ['#0e0b2b','#2d1161','#52137c','#762181','#992d80','#bf3a77','#e04c67','#f66e5c','#fd9869','#fec287','#fdebac'] },
    cividis: { name: 'Cividis', stops: ['#00224e','#083370','#35456c','#4f576c','#666970','#7d7c78','#948e77','#aea371','#c8b866','#e5cf52','#fee838'] },
    turbo: { name: 'Turbo', stops: ['#30123b','#4559cb','#3e9bfe','#19d5cd','#46f884','#a4fc3c','#e1dd37','#fea431','#f05b12','#c32503','#7a0403'] },
    coolwarm: { name: 'Coolwarm', stops: ['#3b4cc0','#5977e3','#7b9ff9','#9ebeff','#c0d4f5','#dddcdc','#f2cbb7','#f7ac8e','#ee8468','#d65244','#b40426'] }
  };
  const THEME = { light: { a: '#3164bf', b: '#c75483', bg: '#f7f8fa' },
    dark: { a: '#7caaff', b: '#fa8db7', bg: '#121720' } };
  const AXIS_NAMES = ['X', 'Y', 'Z', 'W'];
  const DEFAULT_COLORS = { cmap: 'viridis', reverse: false, wire: 'cubes', solid: 'single',
    c4a: null, c4b: null, c3: null };
  const RECOMMENDED_COLORS = { wire: 'w', solid: 'cmap' };
  const STORAGE_KEY = 'hypercube-colors-v3';
  function loadColors() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      if (saved && CMAPS[saved.cmap]) return { ...DEFAULT_COLORS, ...saved };
    } catch (e) {}
    return DEFAULT_COLORS;
  }
  function saveColors(c) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(c)); } catch (e) {} }
  const hexToRgb = hex => { const n = parseInt(hex.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
  const rgbToHex = rgb => '#' + rgb.map(x => Math.round(Math.max(0, Math.min(255, x))).toString(16).padStart(2, '0')).join('');
  function sampleStops(stops, t) {
    const x = Math.max(0, Math.min(1, t)) * (stops.length - 1);
    const i = Math.min(stops.length - 2, Math.floor(x)), f = x - i;
    const a = hexToRgb(stops[i]), b = hexToRgb(stops[i + 1]);
    return rgbToHex(a.map((v, k) => v + (b[k] - v) * f));
  }
  function luminance(hex) {
    const [r, g, b] = hexToRgb(hex).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); });
    return .2126 * r + .7152 * g + .0722 * b;
  }
  function contrast(a, b) {
    const la = luminance(a), lb = luminance(b);
    return (Math.max(la, lb) + .05) / (Math.min(la, lb) + .05);
  }
  const cmapCss = (key, reverse) => {
    const stops = reverse ? CMAPS[key].stops.slice().reverse() : CMAPS[key].stops;
    return 'linear-gradient(90deg,' + stops.join(',') + ')';
  };

  // ---------- Γεωμετρία ----------
  function rotate(v, a, b, angle) {
    const c = Math.cos(angle), s = Math.sin(angle), out = v.slice();
    out[a] = c * v[a] - s * v[b];
    out[b] = s * v[a] + c * v[b];
    return out;
  }
  function rotate4(v, state, phase) {
    let p = rotate(v, 0, 3, (state.xw + phase * 27) * degrees);
    p = rotate(p, 1, 3, (state.yw + phase * 17) * degrees);
    p = rotate(p, 2, 3, state.zw * degrees);
    return rotate(p, 0, 1, phase * 0.12);
  }
  function camera(q, state) {
    const cy = Math.cos(state.yaw), sy = Math.sin(state.yaw);
    const cp = Math.cos(state.pitch), sp = Math.sin(state.pitch);
    const x = cy * q[0] + sy * q[2];
    const z = -sy * q[0] + cy * q[2];
    return [x, cp * q[1] - sp * z, sp * q[1] + cp * z];
  }
  function perspective(q, state) {
    const [x, y, depth] = camera(q, state);
    const k3 = EYE / (EYE - depth);
    return { x: 250 + x * 69 * k3 * state.zoom,
      y: 220 - y * 69 * k3 * state.zoom, depth };
  }
  // Ορατότητα έδρας με πραγματική προοπτική: το μάτι είναι στο (0, 0, EYE) σε συντεταγμένες κάμερας.
  function facing(normal, center, state) {
    const [nx, ny, nz] = camera(normal, state);
    const c = camera(center, state);
    const view = [-c[0], -c[1], EYE - c[2]];
    const length = Math.hypot(nx, ny, nz) * Math.hypot(...view);
    return { front: (nx * view[0] + ny * view[1] + nz * view[2]) / Math.max(1e-12, length),
      light: Math.max(0, (nx * .3 + ny * .6 + nz * .7) / Math.max(1e-12, Math.hypot(nx, ny, nz))), z: c[2] };
  }
  function fitPoints(raw) {
    if (!raw.length) return [];
    const xs = raw.map(p => p.x), ys = raw.map(p => p.y);
    const left = Math.min(...xs), right = Math.max(...xs);
    const top = Math.min(...ys), bottom = Math.max(...ys);
    const fit = Math.min(1, 440 / Math.max(1, right - left), 365 / Math.max(1, bottom - top));
    return raw.map(p => ({ ...p,
      x: 250 + (p.x - (left + right) / 2) * fit,
      y: 220 + (p.y - (top + bottom) / 2) * fit }));
  }
  function project4coords(p, state) {
    const k4 = state.depth / (state.depth - p[3]);
    return [p[0] * k4, p[1] * k4, p[2] * k4];
  }
  function project4(p, state) {
    return perspective(project4coords(p, state), state);
  }
  function hull3D(rotated, state) {
    const points3 = rotated.map(p => project4coords(p, state));
    const faces = [], known = new Set(), eps = 1e-7;
    const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
    const sub = (a, b) => a.map((x, i) => x - b[i]);
    const cross = (a, b) => [a[1] * b[2] - a[2] * b[1],
      a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
    for (let i = 0; i < 16; i++) for (let j = i + 1; j < 16; j++)
      for (let k = j + 1; k < 16; k++) {
        let normal = cross(sub(points3[j], points3[i]), sub(points3[k], points3[i]));
        const size = Math.hypot(...normal);
        if (size < eps) continue;
        normal = normal.map(x => x / size);
        const distances = points3.map(p => dot(normal, sub(p, points3[i])));
        const lo = Math.min(...distances), hi = Math.max(...distances);
        if (lo < -eps && hi > eps) continue;
        if (lo >= -eps) normal = normal.map(x => -x);
        const plane = dot(normal, points3[i]);
        const ids = points3.map((p, index) => ({ p, index }))
          .filter(({ p }) => Math.abs(dot(normal, p) - plane) < eps)
          .map(({ index }) => index);
        if (ids.length < 3) continue;
        const key = ids.join('-');
        if (known.has(key)) continue;
        known.add(key);
        const center = [0, 1, 2].map(axis =>
          ids.reduce((sum, id) => sum + points3[id][axis], 0) / ids.length);
        const ref = Math.abs(normal[2]) < .9 ? [0, 0, 1] : [0, 1, 0];
        const u = cross(ref, normal), v = cross(normal, u);
        const angle = id => {
          const delta = sub(points3[id], center);
          return Math.atan2(dot(delta, v), dot(delta, u));
        };
        ids.sort((a, b) => angle(a) - angle(b));
        const { front, light, z } = facing(normal, center, state);
        const w = ids.reduce((sum, id) => sum + rotated[id][3], 0) / ids.length;
        faces.push({ ids, front, light, z, key, w });
      }
    const screen = fitPoints(points3.map(q => perspective(q, state)));
    const perimeter = new Map();
    faces.forEach(face => face.ids.forEach((a, i) => {
      const b = face.ids[(i + 1) % face.ids.length];
      const key = Math.min(a, b) + '-' + Math.max(a, b);
      const edge = perimeter.get(key) || { a, b, front: -1 };
      edge.front = Math.max(edge.front, face.front);
      perimeter.set(key, edge);
    }));
    return { screen,
      vertices: [...new Set(faces.flatMap(face => face.ids))],
      visibleVertices: [...new Set(faces.filter(face => face.front > 1e-6).flatMap(face => face.ids))],
      faces: faces.sort((a, b) => a.z - b.z),
      edges: [...perimeter.values()].sort((a, b) =>
        (screen[a.a].depth + screen[a.b].depth) - (screen[b.a].depth + screen[b.b].depth)) };
  }
  function crossSection(rotated, state, phase) {
    const points3 = [];
    const edgeToPoint = new Map();
    for (const edge of edges) {
      const a = rotated[edge.a], b = rotated[edge.b];
      const denominator = b[3] - a[3];
      if (Math.abs(denominator) < 1e-9) continue;
      const t = (state.slice - a[3]) / denominator;
      if (t < -1e-8 || t > 1 + 1e-8) continue;
      const q = [0, 1, 2].map(axis => a[axis] + t * (b[axis] - a[axis]));
      let index = points3.findIndex(p => p.reduce((sum, x, axis) => sum + (x - q[axis]) ** 2, 0) < 1e-12);
      if (index < 0) { index = points3.length; points3.push(q); }
      edgeToPoint.set(edge, index);
    }
    const screen = fitPoints(points3.map(q => perspective(q, state)));
    const sectionFaces = [];
    const sectionEdges = new Map();
    const seenFaces = new Set();
    for (let fixed = 0; fixed < 4; fixed++) for (let side = 0; side < 2; side++) {
      const ids = [...new Set(edges.filter(edge => edgeToPoint.has(edge) &&
        ((edge.a >> fixed) & 1) === side && ((edge.b >> fixed) & 1) === side)
        .map(edge => edgeToPoint.get(edge)))];
      if (ids.length < 3) continue;
      // Όταν το επίπεδο περιέχει ολόκληρο τετράγωνο του υπερκύβου, δύο κελιά δίνουν το ίδιο πολύγωνο.
      const faceKey = ids.slice().sort((a, b) => a - b).join('-');
      if (seenFaces.has(faceKey)) continue;
      seenFaces.add(faceKey);
      const axis4 = [0, 0, 0, 0]; axis4[fixed] = side ? 1 : -1;
      const normal = rotate4(axis4, state, phase);
      const length = Math.hypot(normal[0], normal[1], normal[2]);
      if (length < 1e-9) continue;
      const n = [normal[0] / length, normal[1] / length, normal[2] / length];
      const ref = Math.abs(n[2]) < .9 ? [0, 0, 1] : [0, 1, 0];
      const cross = (a, b) => [a[1] * b[2] - a[2] * b[1],
        a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
      const u = cross(ref, n), v = cross(n, u);
      const center = [0, 1, 2].map(axis =>
        ids.reduce((sum, i) => sum + points3[i][axis], 0) / ids.length);
      const angle = i => {
        const delta = points3[i].map((x, axis) => x - center[axis]);
        const dot = vector => delta.reduce((sum, x, axis) => sum + x * vector[axis], 0);
        return Math.atan2(dot(v), dot(u));
      };
      ids.sort((a, b) => angle(a) - angle(b));
      const { front, light } = facing(n, center, state);
      const z = ids.reduce((sum, i) => sum + screen[i].depth, 0) / ids.length;
      sectionFaces.push({ ids, front, light, z, key: fixed + '-' + side, cell: fixed * 2 + side });
      ids.forEach((a, i) => {
        const b = ids[(i + 1) % ids.length];
        const key = Math.min(a, b) + '-' + Math.max(a, b);
        const item = sectionEdges.get(key) || { a, b, front: -1 };
        item.front = Math.max(item.front, front);
        sectionEdges.set(key, item);
      });
    }
    return { screen, vertices: screen.map((_, i) => i), visibleVertices: screen.map((_, i) => i),
      faces: sectionFaces.sort((a, b) => a.z - b.z),
      edges: [...sectionEdges.values()].sort((a, b) =>
        (screen[a.a].depth + screen[a.b].depth) - (screen[b.a].depth + screen[b.b].depth)) };
  }

  const darkQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function App() {
    const [s, setS] = React.useState(initial);
    const [phase, setPhase] = React.useState(0);
    const [colors, setColors] = React.useState(loadColors);
    const [panelOpen, setPanelOpen] = React.useState(false);
    const [dark, setDark] = React.useState(darkQuery ? darkQuery.matches : false);
    const dragging = React.useRef(null);
    React.useEffect(() => {
      if (!darkQuery) return;
      const update = e => setDark(e.matches);
      if (darkQuery.addEventListener) darkQuery.addEventListener('change', update);
      else darkQuery.addListener(update);
      return () => darkQuery.removeEventListener ? darkQuery.removeEventListener('change', update) : darkQuery.removeListener(update);
    }, []);
    React.useEffect(() => saveColors(colors), [colors]);
    React.useEffect(() => {
      if (!s.playing) return;
      let frame, previous;
      function tick(now) {
        if (previous !== undefined) setPhase(v => v + Math.min(now - previous, 50) / 1000);
        previous = now;
        frame = requestAnimationFrame(tick);
      }
      frame = requestAnimationFrame(tick);
      return () => cancelAnimationFrame(frame);
    }, [s.playing]);
    const rotated = vertices.map(v => rotate4(v, s, phase));
    const points = fitPoints(rotated.map(v => project4(v, s)));
    const solid = s.show3D ? (s.mode === 'projection' ? hull3D(rotated, s) :
      crossSection(rotated, s, phase)) : { screen: [], vertices: [], visibleVertices: [], faces: [], edges: [] };
    function footprint(w) {
      const group = points.slice(w * 8, w * 8 + 8);
      return (Math.max(...group.map(p => p.x)) - Math.min(...group.map(p => p.x))) *
        (Math.max(...group.map(p => p.y)) - Math.min(...group.map(p => p.y)));
    }
    const innerW = footprint(0) <= footprint(1) ? 0 : 1;
    const orderedEdges = edges.map((edge, i) => ({
      ...edge, i, z: (points[edge.a].depth + points[edge.b].depth) / 2,
      group: edge.axis === 3 ? -1 : (edge.a >> 3)
    })).sort((a, b) => a.z - b.z);
    const exactCube = !s.playing && phase === 0 && s.xw === 0 && s.yw === 0 &&
      s.zw === 0 && s.show3D && (s.mode === 'projection' || s.slice === 0);
    const set = (key, value) => setS(old => ({ ...old, [key]: value }));
    const setColor = (key, value) => setColors(old => ({ ...old, [key]: value }));

    // ----- χρωματικές βοηθητικές -----
    const theme = dark ? THEME.dark : THEME.light;
    const colorA = colors.c4a || theme.a;
    const colorB = colors.c4b || theme.b;
    const color3 = colors.c3 || theme.b;
    const cm = t => sampleStops(CMAPS[colors.cmap].stops, colors.reverse ? 1 - t : t);
    const wMax = Math.max(1e-6, ...rotated.map(p => Math.abs(p[3])));
    const tw = w => (w / wMax + 1) / 2;
    const axisT = axis => (axis + .5) / 4; // κέντρα 4 ισομήκων διαστημάτων, μακριά από τα σκούρα άκρα
    // περίγραμμα: σκοτεινό/φωτεινό όταν το χρώμα έχει χαμηλή αντίθεση με το φόντο, αλλιώς «κενό» στο χρώμα του φόντου
    const casing = (...hexes) => Math.min(...hexes.map(x => contrast(x, theme.bg))) < 2.2 ?
      { stroke: 'var(--foreground)', opacity: .3 } : { stroke: 'var(--background)', opacity: .9 };
    const wireUsesMap = colors.wire === 'w' || colors.wire === 'axis';
    const solidUsesMap = colors.solid === 'cmap';
    const faceColor = face => !solidUsesMap ? color3 :
      (s.mode === 'projection' ? cm(tw(face.w)) : cm((face.cell + .5) / 8));
    const glowColor = solidUsesMap ? cm(.5) : color3;

    function start(e) { dragging.current = { x: e.clientX, y: e.clientY, yaw: s.yaw, pitch: s.pitch }; e.currentTarget.setPointerCapture(e.pointerId); }
    function move(e) {
      if (!dragging.current) return;
      const d = dragging.current;
      setS(old => ({ ...old,
        yaw: d.yaw + (e.clientX - d.x) * 0.009,
        pitch: Math.max(-1.45, Math.min(1.45, d.pitch + (e.clientY - d.y) * 0.009))
      }));
    }
    function slider(key, label, min, max, step, suffix) {
      return h('label', { key, className: 'hc-slider' },
        h('span', { className: 'hc-control-head' }, h('span', null, label), h('output', null, s[key] + suffix)),
        h('input', { className: 'form-range', type: 'range', min, max, step, value: s[key],
          onChange: e => set(key, Number(e.target.value)), 'aria-label': label }));
    }
    function switchControl(key, label) {
      return h('label', { className: 'form-check form-switch', key },
        h('input', { className: 'form-check-input', type: 'checkbox', checked: s[key],
          onChange: e => set(key, e.target.checked) }),
        h('span', { className: 'form-check-label' }, label));
    }
    function modeControl() {
      return h('label', { className: 'hc-mode' }, '3D απεικόνιση ',
        h('select', { className: 'form-select', value: s.mode,
          onChange: e => set('mode', e.target.value) },
          h('option', { value: 'projection' }, 'Προβολή · περίβλημα'),
          h('option', { value: 'slice' }, 'Τομή · επίπεδο W')));
    }
    function colorInput(key, label, value) {
      return h('label', { className: 'hc-color', key },
        h('input', { type: 'color', value, onChange: e => setColor(key, e.target.value), 'aria-label': label }),
        h('span', null, label));
    }
    function colorPanel() {
      return h('section', { className: 'hc-panel', id: 'hc-color-panel', 'aria-label': 'Ρυθμίσεις χρωμάτων' },
        h('div', { className: 'hc-panel-head' },
          h('strong', null, 'Χρώματα'),
          h('button', { type: 'button', className: 'btn btn-sm', onClick: () => setPanelOpen(false) }, 'Κλείσιμο')),
        h('span', { className: 'hc-panel-label', id: 'hc-cmap-label' }, 'Colormap'),
        h('div', { className: 'hc-swatches', role: 'radiogroup', 'aria-labelledby': 'hc-cmap-label' },
          Object.keys(CMAPS).map(key => h('button', { key, type: 'button', role: 'radio',
            'aria-checked': colors.cmap === key, className: 'hc-swatch' + (colors.cmap === key ? ' is-active' : ''),
            onClick: () => setColor('cmap', key) },
            h('span', { className: 'hc-swatch-bar', style: { background: cmapCss(key, colors.reverse) } }),
            h('span', null, CMAPS[key].name)))),
        h('div', { className: 'hc-panel-row' },
          h('label', { className: 'form-check' },
            h('input', { className: 'form-check-input', type: 'checkbox', checked: colors.reverse,
              onChange: e => setColor('reverse', e.target.checked) }),
            h('span', null, 'Αντιστροφή colormap'))),
        h('div', { className: 'hc-panel-grid' },
          h('div', { className: 'hc-field' },
            h('label', { className: 'hc-field' },
              h('span', { className: 'hc-panel-label' }, 'Υπερκύβος 4D (αριστερά)'),
              h('select', { className: 'form-select', value: colors.wire, onChange: e => setColor('wire', e.target.value) },
                h('option', { value: 'w' }, 'Κατά W · colormap (βάθος 4ης διάστασης)'),
                h('option', { value: 'axis' }, 'Κατά άξονα ακμής · colormap (X, Y, Z, W)'),
                h('option', { value: 'cubes' }, 'Δύο κύβοι · εσωτερικός / εξωτερικός'),
                h('option', { value: 'single' }, 'Ενιαίο χρώμα'))),
            colors.wire === 'cubes' && h('div', { className: 'hc-colors' },
              colorInput('c4a', 'Εξωτερικός κύβος', colorA), colorInput('c4b', 'Εσωτερικός κύβος', colorB)),
            colors.wire === 'single' && h('div', { className: 'hc-colors' }, colorInput('c4a', 'Χρώμα ακμών', colorA)),
            colors.wire === 'w' && h('p', { className: 'hc-note' },
              'Κάθε κορυφή παίρνει χρώμα από τη συντεταγμένη W μετά την περιστροφή. Κάθε ακμή είναι διαβάθμιση ανάμεσα στις δύο κορυφές της. Μεγαλύτερο W σημαίνει πιο κοντά στην 4D κάμερα.'),
            colors.wire === 'axis' && h('p', { className: 'hc-note' },
              'Οι 32 ακμές χωρίζονται σε 4 ομάδες των 8, μία για κάθε άξονα X, Y, Z, W του αρχικού υπερκύβου.')),
          h('div', { className: 'hc-field' },
            h('label', { className: 'hc-field' },
              h('span', { className: 'hc-panel-label' }, '3D σχήμα (δεξιά)'),
              h('select', { className: 'form-select', value: colors.solid, onChange: e => setColor('solid', e.target.value) },
                h('option', { value: 'single' }, 'Ενιαίο χρώμα'),
                h('option', { value: 'cmap' }, 'Colormap · προβολή κατά W, τομή κατά κελί'))),
            colors.solid === 'single' && h('div', { className: 'hc-colors' }, colorInput('c3', 'Χρώμα σχήματος', color3)),
            colors.solid === 'cmap' && h('p', { className: 'hc-note' },
              'Προβολή: κάθε έδρα παίρνει το χρώμα του μέσου W των κορυφών της. Τομή: κάθε έδρα προέρχεται από ένα από τα 8 κελιά (X±, Y±, Z±, W±).'))),
        h('div', { className: 'hc-panel-foot' },
          h('button', { type: 'button', className: 'btn btn-sm btn-primary',
            onClick: () => setColors(old => ({ ...old, ...RECOMMENDED_COLORS })) }, 'Προτεινόμενο για 4D'),
          h('button', { type: 'button', className: 'btn btn-sm', onClick: () => setColors(DEFAULT_COLORS) }, 'Προεπιλεγμένα χρώματα')));
    }
    function wireKey() {
      if (colors.wire === 'w') return h('div', { className: 'hc-key' },
        h('span', { title: 'Μεγαλύτερο W = πιο κοντά στην 4D κάμερα' }, 'W −' + wMax.toFixed(2)),
        h('span', { className: 'hc-key-bar', style: { background: cmapCss(colors.cmap, colors.reverse) }, 'aria-hidden': true }),
        h('span', { title: 'Μεγαλύτερο W = πιο κοντά στην 4D κάμερα' }, '+' + wMax.toFixed(2)));
      if (colors.wire === 'axis') return h('div', { className: 'hc-key' }, AXIS_NAMES.map((name, axis) =>
        h('span', { key: name, className: 'hc-chip' }, h('i', { style: { background: cm(axisT(axis)) } }), 'ακμές ' + name)));
      return h('div', { className: 'hc-key', 'aria-hidden': true });
    }
    function solidKey() {
      if (!solidUsesMap || !s.show3D) return h('div', { className: 'hc-key', 'aria-hidden': true });
      if (s.mode === 'projection') return h('div', { className: 'hc-key' },
        h('span', null, 'μέσο W έδρας −'),
        h('span', { className: 'hc-key-bar', style: { background: cmapCss(colors.cmap, colors.reverse) }, 'aria-hidden': true }),
        h('span', null, '+'));
      return h('div', { className: 'hc-key' }, Array.from({ length: 8 }, (_, cell) =>
        h('span', { key: cell, className: 'hc-chip' }, h('i', { style: { background: cm((cell + .5) / 8) } }),
          AXIS_NAMES[cell >> 1] + (cell & 1 ? '+' : '−'))));
    }
    function scene(shaded) {
      const prefix = shaded ? 'hc-section' : 'hc-wire';
      const glow = shaded ? glowColor : (colors.wire === 'cubes' || colors.wire === 'single' ? colorA : cm(.5));
      return h('svg', { viewBox: '0 0 500 440', role: 'img',
        'aria-label': shaded ? (s.mode === 'projection' ? 'Το κυρτό εξωτερικό περίβλημα της 3D προβολής.' :
          'Η τρισδιάστατη τομή του περιστρεφόμενου υπερκύβου.') :
          'Ο σκελετός του υπερκύβου με 16 κορυφές και 32 ακμές.',
        onPointerDown: start, onPointerMove: move,
        onPointerUp: () => { dragging.current = null; },
        onPointerCancel: () => { dragging.current = null; },
        style: { cursor: dragging.current ? 'grabbing' : 'grab' } },
        h('defs', null,
          h('radialGradient', { id: prefix + '-glow' },
            h('stop', { offset: '0%', stopColor: glow, stopOpacity: shaded ? '.12' : '.1' }),
            h('stop', { offset: '100%', stopColor: glow, stopOpacity: '0' })),
          h('radialGradient', { id: prefix + '-shadow' },
            h('stop', { offset: '0%', stopColor: glowColor, stopOpacity: '.25' }),
            h('stop', { offset: '100%', stopColor: glowColor, stopOpacity: '0' })),
          !shaded && colors.wire === 'w' && orderedEdges.map(edge => {
            const a = points[edge.a], b = points[edge.b];
            return h('linearGradient', { key: edge.i, id: prefix + '-edge-' + edge.i, gradientUnits: 'userSpaceOnUse',
              x1: a.x, y1: a.y, x2: b.x, y2: b.y },
              h('stop', { offset: '0%', stopColor: cm(tw(rotated[edge.a][3])) }),
              h('stop', { offset: '100%', stopColor: cm(tw(rotated[edge.b][3])) }));
          })),
        h('ellipse', { cx: 250, cy: 220, rx: 245, ry: 208, fill: 'url(#' + prefix + '-glow)' }),
        shaded && s.show3D && h('ellipse', { cx: 255, cy: 390, rx: 155, ry: 29, fill: 'url(#' + prefix + '-shadow)' }),
        shaded && !s.show3D && h('text', { x: 250, y: 220, textAnchor: 'middle', fill: 'var(--muted-foreground)' },
          'Ενεργοποίησε το 3D σχήμα'),
        shaded && solid.faces.filter(face => s.mode === 'slice' || face.front > 1e-6).map(face => {
          const fill = faceColor(face);
          return h('polygon', { key: face.key,
            points: face.ids.map(index => solid.screen[index].x + ',' + solid.screen[index].y).join(' '),
            fill,
            fillOpacity: face.front > 0 ? (s.mode === 'projection' ? Math.min(.94, .66 + face.light * .22 + face.front * .08) :
              Math.min(.7, .24 + face.light * .28 + face.front * .14)) : .045,
            stroke: fill, strokeOpacity: face.front > 0 ? .5 : .12,
            strokeWidth: 1,
            style: face.front > 0 ? { filter: 'drop-shadow(0px 5px 7px ' + fill + ')' } : undefined });
        }),
        shaded && solid.edges.filter(edge => s.mode === 'slice' || edge.front > 1e-6).map((edge, i) => {
          const a = solid.screen[edge.a], b = solid.screen[edge.b];
          return h('line', { key: i, x1: a.x, y1: a.y, x2: b.x, y2: b.y,
            stroke: solidUsesMap ? 'var(--foreground)' : color3,
            strokeOpacity: solidUsesMap ? (edge.front > 0 ? .55 : .2) : (edge.front > 0 ? .95 : .36),
            strokeWidth: edge.front > 0 ? (solidUsesMap ? 1.6 : 2.3) : 1.5, strokeLinecap: 'round' });
        }),
        shaded && solid.visibleVertices.map(i => {
          const fill = solidUsesMap && s.mode === 'projection' ? cm(tw(rotated[i][3])) : (solidUsesMap ? 'var(--foreground)' : color3);
          return h('circle', { key: i, cx: solid.screen[i].x, cy: solid.screen[i].y,
            r: 3.2, fill, stroke: 'var(--background)', strokeWidth: 1.2 });
        }),
        !shaded && orderedEdges.map(edge => {
          const a = points[edge.a], b = points[edge.b];
          const opacity = Math.min(.98, Math.max(.34, .65 + edge.z * .11));
          const line = { x1: a.x, y1: a.y, x2: b.x, y2: b.y, strokeLinecap: 'round' };
          if (colors.wire === 'cubes' || colors.wire === 'single') {
            const inner = colors.wire === 'cubes' && edge.group === innerW;
            return h('line', { key: edge.i, ...line, stroke: inner ? colorB : colorA,
              strokeOpacity: edge.group === -1 && colors.wire === 'cubes' ? opacity * .66 : opacity,
              strokeWidth: inner ? 2.4 : (colors.wire === 'single' ? 2 : 1.8) });
          }
          const ends = colors.wire === 'w' ? [cm(tw(rotated[edge.a][3])), cm(tw(rotated[edge.b][3]))] : [cm(axisT(edge.axis))];
          const halo = casing(...ends);
          return h(React.Fragment, { key: edge.i },
            h('line', { ...line, stroke: halo.stroke, strokeOpacity: halo.opacity * Math.min(1, opacity + .2), strokeWidth: 4.4 }),
            h('line', { ...line, stroke: colors.wire === 'w' ? 'url(#' + prefix + '-edge-' + edge.i + ')' : ends[0],
              strokeOpacity: Math.min(1, opacity + .15), strokeWidth: 2.5 }));
        }),
        !shaded && points.map((p, i) => {
          let fill = (i >> 3) === innerW ? colorB : colorA, stroke = 'var(--background)';
          if (colors.wire === 'single') fill = colorA;
          if (colors.wire === 'axis') fill = 'var(--foreground)';
          if (colors.wire === 'w') { fill = cm(tw(rotated[i][3])); stroke = casing(fill).stroke; }
          return h('circle', { key: i, cx: p.x, cy: p.y,
            r: Math.max(3, 3.8 + p.depth * .38), fill, stroke, strokeWidth: 1.35 });
        }));
    }
    return h(React.Fragment, null,
      h('div', { className: 'hc-top' },
        h('h2', null, 'Υπερκύβος 4D'),
        h('div', { className: 'hc-actions' },
          switchControl('playing', 'Αυτόματη περιστροφή'),
          switchControl('show3D', '3D σχήμα'),
          h('button', { type: 'button', className: 'btn btn-primary',
            onClick: () => {
              setS(old => ({ ...old, playing: false, show3D: true, mode: 'projection',
                xw: 0, yw: 0, zw: 0, slice: 0, zoom: 1 }));
              setPhase(0);
            } }, 'Δείξε 3D κύβο'),
          h('button', { type: 'button', className: 'btn', 'aria-expanded': panelOpen, 'aria-controls': 'hc-color-panel',
            onClick: () => setPanelOpen(open => !open) },
            h('span', { 'aria-hidden': true, style: { display: 'inline-block', width: 22, height: 10, borderRadius: 3,
              background: cmapCss(colors.cmap, colors.reverse) } }), 'Χρώματα'),
          h('a', { className: 'btn', href: 'hypercube-math.pdf', target: '_blank', rel: 'noopener' },
            'Μαθηματική τεκμηρίωση (PDF)'),
          h('button', { type: 'button', className: 'btn',
            onClick: () => { setS(initial); setPhase(0); } }, 'Επαναφορά'))),
      panelOpen && colorPanel(),
      h('div', { className: 'hc-stage' },
        h('div', { className: 'hc-view' },
          h('div', { className: 'hc-view-label' }, h('strong', null, 'Υπερκύβος 4D'), h('span', null, '16 κορυφές · 32 ακμές')),
          scene(false), wireKey()),
        h('div', { className: 'hc-view' },
          h('div', { className: 'hc-view-label' }, h('strong', null, s.mode === 'projection' ? 'Προβολή στον 3D χώρο' : 'Τομή στον 3D χώρο'),
            h('span', null, s.show3D ? solid.vertices.length + ' κορυφές · ' + solid.faces.length + ' έδρες' : 'ανενεργή')),
          scene(true), solidKey())),
      h('div', { className: 'hc-options' }, modeControl()),
      h('div', { className: 'hc-controls' },
        slider('xw', 'Περιστροφή X–W', -180, 180, 1, '°'),
        slider('yw', 'Περιστροφή Y–W', -180, 180, 1, '°'),
        slider('zw', 'Περιστροφή Z–W', -180, 180, 1, '°'),
        s.mode === 'slice' && slider('slice', 'Επίπεδο τομής W', -.85, .85, .01, ''),
        slider('depth', '4D προοπτική', 2.6, 8, .1, ''),
        slider('zoom', 'Μεγέθυνση', .5, 1.35, .01, '×')),
      h('p', { className: 'hc-hint', 'aria-live': 'polite' },
        exactCube ? (s.mode === 'projection' ? 'Κυβική 3D προβολή' : 'Κυβική 3D τομή') +
          ': X–W = 0°, Y–W = 0°, Z–W = 0°' + (s.mode === 'slice' ? ', W = 0' : '') +
          '. Η αυτόματη περιστροφή σταμάτησε.' :
          s.mode === 'projection' ? 'Δεξιά: το κυρτό εξωτερικό περίβλημα των 16 κορυφών αφού προβληθούν από 4D σε 3D.' :
            'Δεξιά: τομή του 4D υπερκύβου με το επιλεγμένο επίπεδο W.'));
  }
  ReactDOM.createRoot(root).render(h(App));
})();
</script>
